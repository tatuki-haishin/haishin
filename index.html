<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホームページ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>まごころサポート</h1>
    </header>

    <main>
        <section id="hero">
            <h2>家族の安心を地域の力で</h2>
            <p>ここにサービスや商品の説明を書きます。</p>
            <button>詳しく見る</button>
        </section>
        <section id="features">
            <h2>特徴</h2>

            <div class="feature-container">

                <div class="feature">
                    <h3>特徴1</h3>
                    <p>ここに特徴1の説明を書きます。</p>
                </div>

                <div class="feature">
                    <h3>特徴2</h3>
                    <p>ここに特徴2の説明を書きます。</p>
                </div>

                <div class="feature">
                    <h3>特徴3</h3>
                    <p>ここに特徴3の説明を書きます。</p>
                </div>
        </section>
        <section id="about">
            <div class="about-image">
                <img src="images/34766263_s.jpg" alt="サービス画像">
            </div>

            <div class="about-text">
                <h2>サービス紹介</h2>
                <p>
                    ここにサービスや商品の詳しい説明を書きます。
                    後から自由に変更できます。
                </p>
            </div>
        </section>
        <section id="contact">
            <h2>お問い合わせ</h2>

            <p>
                ご質問やご相談はこちらからお問い合わせください。
            </p>

            <button>
                お問い合わせする
            </button>
        </section>
    </main>

    <footer>
        <p>© 2026 My Landing Page</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
